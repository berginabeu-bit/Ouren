name: Android Debug CI
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true
      - name: Install Android SDK platform/build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Validate localized content
        run: python3 tools/localization_audit.py
      - name: Compile, test and lint
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --stacktrace
      - name: Verify debug APK
        run: ./tools/verify_apk.sh app/build/outputs/apk/debug/app-debug.apk com.focusedmind.app
      - uses: actions/upload-artifact@v4
        with:
          name: berna-focus-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
